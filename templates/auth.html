<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar &mdash; Resumo Acad&ecirc;mico</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f8f9fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 32px rgba(0,0,0,.08);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .top {
      background: #0f172a;
      padding: 2rem 2rem 1.6rem;
      text-align: center;
      color: #f1f5f9;
      border-bottom: 3px solid #1e40af;
    }
    .top .logo {
      width: 52px; height: 52px;
      background: #1e40af;
      border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: .6rem;
    }
    .top h1 {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 1.25rem;
      margin-top: .2rem;
    }
    .top p { font-size: .84rem; opacity: .65; margin-top: .3rem; }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid #e2e8f0;
    }
    .tab {
      flex: 1;
      padding: .85rem;
      text-align: center;
      font-size: .88rem;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      border: none;
      background: none;
      transition: color .15s;
      border-bottom: 2.5px solid transparent;
      margin-bottom: -1px;
    }
    .tab.active { color: #0f172a; border-bottom-color: #1e40af; }

    /* Form */
    .body { padding: 1.8rem; }
    .form { display: none; flex-direction: column; gap: 1rem; }
    .form.active { display: flex; }

    label {
      font-size: .8rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: .25rem;
      display: block;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: .7rem 1rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: .95rem;
      transition: border .2s, box-shadow .2s;
      outline: none;
      font-family: inherit;
    }
    input:focus { border-color: #1e40af; box-shadow: 0 0 0 3px rgba(30,64,175,.1); }

    .btn-submit {
      width: 100%;
      padding: .85rem;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
      margin-top: .3rem;
      font-family: inherit;
    }
    .btn-submit:hover { background: #1e293b; }

    .erro {
      background: #fef2f2;
      color: #991b1b;
      padding: .7rem 1rem;
      border-radius: 6px;
      font-size: .85rem;
      border-left: 4px solid #ef4444;
    }
    .voltar {
      display: block;
      text-align: center;
      margin-top: 1.2rem;
      color: #64748b;
      font-size: .84rem;
      text-decoration: none;
    }
    .voltar:hover { color: #1e40af; }
    .hint {
      font-size: .78rem;
      color: #94a3b8;
      text-align: center;
      margin-top: -.3rem;
    }
    .hint a { color: #1e40af; text-decoration: none; font-weight: 600; }
    .hint a:hover { text-decoration: underline; }

    /* Google SSO */
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      width: 100%;
      padding: .75rem;
      background: #fff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: .93rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, box-shadow .15s;
      margin-bottom: .2rem;
      font-family: inherit;
    }
    .btn-google:hover { background: #f8fafc; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .btn-google svg { flex-shrink: 0; }
    .separador {
      display: flex;
      align-items: center;
      gap: .6rem;
      color: #94a3b8;
      font-size: .78rem;
      margin: .8rem 0;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .separador::before, .separador::after {
      content: ''; flex: 1; height: 1px; background: #e2e8f0;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    </div>
    <h1>Resumo Acad&ecirc;mico</h1>
    <p>Entre para salvar seus resumos na nuvem</p>
  </div>

  <div class="tabs">
    <button class="tab {% if not request.args.get('modo') or request.args.get('modo') == 'login' %}active{% endif %}"
            onclick="trocarAba('login')">Entrar</button>
    <button class="tab {% if request.args.get('modo') == 'cadastro' %}active{% endif %}"
            onclick="trocarAba('cadastro')">Criar conta</button>
  </div>

  <div class="body">
    {% if erro %}
    <div class="erro">{{ erro }}</div>
    {% endif %}

    <a class="btn-google" href="/auth/google">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar com Google
    </a>

    <div class="separador">ou use seu e-mail</div>

    <!-- Login -->
    <form class="form {% if not request.args.get('modo') or request.args.get('modo') == 'login' %}active{% endif %}"
          id="form-login" method="POST" action="/entrar">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="acao" value="login">
      <div>
        <label for="email-l">E-mail</label>
        <input type="email" id="email-l" name="email" placeholder="seu@email.com" required autocomplete="email">
      </div>
      <div>
        <label for="senha-l">Senha</label>
        <input type="password" id="senha-l" name="senha" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit">Entrar</button>
      <p class="hint">N&atilde;o tem conta? <a href="#" onclick="trocarAba('cadastro'); return false;">Cadastre-se</a></p>
    </form>

    <!-- Cadastro -->
    <form class="form {% if request.args.get('modo') == 'cadastro' %}active{% endif %}"
          id="form-cadastro" method="POST" action="/entrar">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="acao" value="cadastro">
      <div>
        <label for="email-c">E-mail</label>
        <input type="email" id="email-c" name="email" placeholder="seu@email.com" required autocomplete="email">
      </div>
      <div>
        <label for="senha-c">Senha <span style="color:#94a3b8;font-weight:400;text-transform:none;letter-spacing:0">(min. 6 caracteres)</span></label>
        <input type="password" id="senha-c" name="senha" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="btn-submit">Criar conta</button>
      <p class="hint">J&aacute; tem conta? <a href="#" onclick="trocarAba('login'); return false;">Entrar</a></p>
    </form>

    <a class="voltar" href="/">&larr; Voltar ao site</a>
  </div>
</div>

<script>
  function trocarAba(aba) {
    document.querySelectorAll('.tab').forEach(function(t, i) {
      t.classList.toggle('active', (i === 0 && aba === 'login') || (i === 1 && aba === 'cadastro'));
    });
    document.getElementById('form-login').classList.toggle('active', aba === 'login');
    document.getElementById('form-cadastro').classList.toggle('active', aba === 'cadastro');
  }
  {% if erro and request.form.get('acao') == 'cadastro' %}
  trocarAba('cadastro');
  {% endif %}
</script>
</body>
</html>
