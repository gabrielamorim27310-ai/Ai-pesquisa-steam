<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Resumo de Aulas</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,.12);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .top {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      padding: 2rem 2rem 1.5rem;
      text-align: center;
      color: #fff;
    }
    .top .logo { font-size: 2.8rem; }
    .top h1 { font-size: 1.3rem; margin-top: .4rem; }
    .top p { font-size: .85rem; opacity: .85; margin-top: .3rem; }

    /* Abas */
    .tabs {
      display: flex;
      border-bottom: 2px solid #f3f4f6;
    }
    .tab {
      flex: 1;
      padding: .9rem;
      text-align: center;
      font-size: .9rem;
      font-weight: 600;
      color: #9ca3af;
      cursor: pointer;
      border: none;
      background: none;
      transition: color .15s, border-bottom .15s;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab.active { color: #4f46e5; border-bottom-color: #4f46e5; }

    /* Formulário */
    .body { padding: 1.8rem; }
    .form { display: none; flex-direction: column; gap: 1rem; }
    .form.active { display: flex; }

    label {
      font-size: .82rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: .25rem;
      display: block;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: .7rem 1rem;
      border: 1.5px solid #d1d5db;
      border-radius: 9px;
      font-size: .95rem;
      transition: border .2s;
      outline: none;
    }
    input:focus { border-color: #4f46e5; }

    .btn-submit {
      width: 100%;
      padding: .85rem;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
      margin-top: .4rem;
    }
    .btn-submit:hover { opacity: .88; }

    .erro {
      background: #fee2e2;
      color: #991b1b;
      padding: .7rem 1rem;
      border-radius: 8px;
      font-size: .85rem;
    }
    .voltar {
      display: block;
      text-align: center;
      margin-top: 1.2rem;
      color: #6b7280;
      font-size: .85rem;
      text-decoration: none;
    }
    .voltar:hover { color: #4f46e5; }
    .hint {
      font-size: .78rem;
      color: #9ca3af;
      text-align: center;
      margin-top: -.3rem;
    }
    /* Google SSO */
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      width: 100%;
      padding: .75rem;
      background: #fff;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: .95rem;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, box-shadow .15s;
      margin-bottom: .2rem;
    }
    .btn-google:hover { background: #f9fafb; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .btn-google svg { flex-shrink: 0; }
    .separador {
      display: flex;
      align-items: center;
      gap: .6rem;
      color: #9ca3af;
      font-size: .8rem;
      margin: .8rem 0;
    }
    .separador::before, .separador::after {
      content: ''; flex: 1; height: 1px; background: #e5e7eb;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="logo">📚</div>
    <h1>Resumo de Aulas</h1>
    <p>Entre para salvar seus resumos na nuvem</p>
  </div>

  <div class="tabs">
    <button class="tab {% if not request.args.get('modo') or request.args.get('modo') == 'login' %}active{% endif %}"
            onclick="trocarAba('login')">Entrar</button>
    <button class="tab {% if request.args.get('modo') == 'cadastro' %}active{% endif %}"
            onclick="trocarAba('cadastro')">Criar conta</button>
  </div>

  <div class="body">
    {% if erro %}
    <div class="erro">{{ erro }}</div>
    {% endif %}

    <!-- Botão Google SSO -->
    <a class="btn-google" href="/auth/google">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar com Google
    </a>

    <div class="separador">ou use seu e-mail</div>

    <!-- Login -->
    <form class="form {% if not request.args.get('modo') or request.args.get('modo') == 'login' %}active{% endif %}"
          id="form-login" method="POST" action="/entrar">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="acao" value="login">
      <div>
        <label for="email-l">E-mail</label>
        <input type="email" id="email-l" name="email" placeholder="seu@email.com" required autocomplete="email">
      </div>
      <div>
        <label for="senha-l">Senha</label>
        <input type="password" id="senha-l" name="senha" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit">Entrar</button>
      <p class="hint">Não tem conta? <a href="#" onclick="trocarAba('cadastro'); return false;">Cadastre-se grátis</a></p>
    </form>

    <!-- Cadastro -->
    <form class="form {% if request.args.get('modo') == 'cadastro' %}active{% endif %}"
          id="form-cadastro" method="POST" action="/entrar">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="acao" value="cadastro">
      <div>
        <label for="email-c">E-mail</label>
        <input type="email" id="email-c" name="email" placeholder="seu@email.com" required autocomplete="email">
      </div>
      <div>
        <label for="senha-c">Senha <span style="color:#9ca3af;font-weight:400">(mín. 6 caracteres)</span></label>
        <input type="password" id="senha-c" name="senha" placeholder="••••••••" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="btn-submit">Criar conta</button>
      <p class="hint">Já tem conta? <a href="#" onclick="trocarAba('login'); return false;">Entrar</a></p>
    </form>

    <a class="voltar" href="/">← Voltar ao site sem entrar</a>
  </div>
</div>

<script>
  function trocarAba(aba) {
    document.querySelectorAll('.tab').forEach(function(t, i) {
      t.classList.toggle('active', (i === 0 && aba === 'login') || (i === 1 && aba === 'cadastro'));
    });
    document.getElementById('form-login').classList.toggle('active', aba === 'login');
    document.getElementById('form-cadastro').classList.toggle('active', aba === 'cadastro');
  }
  {% if erro and request.form.get('acao') == 'cadastro' %}
  trocarAba('cadastro');
  {% endif %}
</script>
</body>
</html>
