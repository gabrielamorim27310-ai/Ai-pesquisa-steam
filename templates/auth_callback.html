<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Entrando...</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
    }
    .box {
      background: #fff; border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
      padding: 2.5rem 2rem; text-align: center; max-width: 360px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e5e7eb; border-top-color: #7c3aed;
      border-radius: 50%; animation: spin .7s linear infinite;
      margin: 0 auto 1.2rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #6b7280; font-size: .95rem; }
    .erro { color: #dc2626; }
  </style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p id="msg">Finalizando login com Google...</p>
</div>
<script>
  (function() {
    // Supabase retorna os tokens no fragment (#access_token=...&refresh_token=...)
    var hash = window.location.hash.substring(1);
    var params = {};
    hash.split('&').forEach(function(p) {
      var kv = p.split('=');
      params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });

    var access_token  = params['access_token'];
    var refresh_token = params['refresh_token'];

    if (!access_token) {
      document.getElementById('msg').textContent = 'Erro: token não encontrado. Tente novamente.';
      document.getElementById('msg').className = 'erro';
      setTimeout(function() { window.location.href = '/entrar'; }, 2500);
      return;
    }

    fetch('/auth/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ access_token: access_token, refresh_token: refresh_token })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) {
        window.location.href = '/';
      } else {
        document.getElementById('msg').textContent = 'Erro ao salvar sessão. Tente novamente.';
        document.getElementById('msg').className = 'erro';
        setTimeout(function() { window.location.href = '/entrar'; }, 2500);
      }
    })
    .catch(function() {
      window.location.href = '/';
    });
  })();
</script>
</body>
</html>
